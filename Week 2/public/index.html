<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Week 2 API!</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 4rem auto;
      padding: 0 1.5rem;
      color: #222;
      line-height: 1.6;
    }
    h1 { color: #d1223a; }
    code {
      background: #f2f2f2;
      padding: 2px 6px;
      border-radius: 4px;
    }
    ul { padding-left: 1.2rem; }
  </style>
</head>
<body>
  <h1>My Week 2 API!</h1>
  <p>This static page is served at <code>/</code>. Try the API routes below with curl or Postman:</p>
  <ul>
    <li><code>GET /api</code> &rarr; "My Week 2 API!"</li>
    <li><code>POST /user</code> &rarr; body: <code>{ "name": "...", "email": "..." }</code></li>
    <li><code>GET /user/:id</code> &rarr; "User [id] profile"</li>
  </ul>
</body>
</html>
